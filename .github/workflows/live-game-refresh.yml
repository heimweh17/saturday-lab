name: Refresh current games
run-name: Refresh current games · ${{ inputs.trigger || github.event_name }}

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/live-game-refresh.yml
  schedule:
    # GitHub schedules are best-effort and occasionally drop a queued run.
    # These slower, offset runs back up the independent QStash clock.
    - cron: "53 */4 * * 1-4"
    - cron: "53 */2 * * 0,5"
    - cron: "8,38 * * * 6"
  workflow_dispatch:
    inputs:
      trigger:
        description: Caller label recorded in the Actions run
        required: false
        default: manual
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: saturday-lab-data-publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Record refresh source
        shell: bash
        run: |
          {
            echo "### Current-game refresh"
            echo "- Trigger: \`${{ inputs.trigger || github.event_name }}\`"
            echo "- Started: \`$(date -u +'%Y-%m-%dT%H:%M:%SZ')\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Refresh mutable game feed
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if python analytics/live_feed.py; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "Current-game refresh failed after three full attempts." >&2
              exit 1
            fi
            delay=$((attempt * 30))
            echo "Refresh attempt $attempt failed; retrying in ${delay}s." >&2
            sleep "$delay"
          done
      - name: Publish only when game data changed
        shell: bash
        run: |
          if git diff --quiet -- public/data/live-2026.json; then
            echo "No score, status, schedule or game-detail changes."
            exit 0
          fi
          git config user.name "saturday-lab-bot"
          git config user.email "saturday-lab-bot@users.noreply.github.com"
          git add public/data/live-2026.json
          git commit -m "Refresh current game feed"
          git push origin HEAD:main
      - name: Backstop the weekly model publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          eastern = ZoneInfo("America/New_York")
          now = datetime.now(timezone.utc).astimezone(eastern)
          in_retry_window = (
              (now.weekday() == 0 and (now.hour, now.minute) >= (6, 0))
              or now.weekday() == 1
          )
          if not in_retry_window:
              print("Weekly backstop is active Monday after 06:00 ET through Tuesday.")
              raise SystemExit(0)

          manifest = json.loads(Path("public/data/manifest.json").read_text())
          raw = manifest.get("generatedAt")
          published = datetime.fromisoformat(raw.replace("Z", "+00:00")).astimezone(eastern) if raw else None
          days_since_monday = now.weekday()
          cycle_start = now.date() - timedelta(days=days_since_monday)
          if published and published.date() >= cycle_start:
              print("This publication cycle's formal model snapshot is already published.")
              raise SystemExit(0)

          print("No formal snapshot exists for this publication cycle; dispatching the weekly workflow.")
          subprocess.run(
              [
                  "gh", "workflow", "run", "weekly-model-refresh.yml",
                  "--ref", os.environ["GITHUB_REF_NAME"],
                  "-f", "force=false",
              ],
              check=True,
          )
          PY
