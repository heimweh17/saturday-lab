name: Generate social graphics

on:
  workflow_dispatch:
    inputs:
      edition:
        description: Graphic set to generate
        type: choice
        required: true
        default: weekly-preview
        options:
          - weekly-preview
          - monday-recap
      season:
        description: Season year
        required: true
        default: '2026'
      week:
        description: Week number
        required: true
        default: '5'
      featured_game_ids:
        description: Optional comma-separated game IDs to pin as featured
        required: false
        default: ''
      upset_game_id:
        description: Optional game ID for Upset Watch
        required: false
        default: ''
      include_started:
        description: Include games already live or final
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Render carousel
        env:
          SEASON: ${{ inputs.season }}
          WEEK: ${{ inputs.week }}
          EDITION: ${{ inputs.edition }}
          FEATURED: ${{ inputs.featured_game_ids }}
          UPSET: ${{ inputs.upset_game_id }}
          INCLUDE_STARTED: ${{ inputs.include_started }}
        run: |
          args=(--season "$SEASON" --week "$WEEK" --output social-output)
          if [[ -n "$FEATURED" ]]; then args+=(--featured "$FEATURED"); fi
          if [[ -n "$UPSET" ]]; then args+=(--upset "$UPSET"); fi
          if [[ "$EDITION" == "monday-recap" ]]; then
            node scripts/social/generate-recap.mjs "${args[@]}"
          else
            if [[ "$INCLUDE_STARTED" == "true" ]]; then args+=(--include-started); fi
            node scripts/social/generate.mjs "${args[@]}"
          fi
      - name: Verify PNG dimensions
        run: SOCIAL_SAMPLE="$(find social-output -name '01-*.png' | head -1)" npm run test:social
      - uses: actions/upload-artifact@v4
        with:
          name: saturday-lab-${{ inputs.season }}-week-${{ inputs.week }}-${{ inputs.edition }}
          path: social-output/
          if-no-files-found: error
          retention-days: 30

